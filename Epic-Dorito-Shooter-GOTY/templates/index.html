<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Epic Leaderboard</title>
        <link rel="icon" href="{{url_for('static', filename='favicon.ico')}}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container-fluid">
            <h1 class="display-1 text-center" id="pageHeader">Top 5 Leaderboard</h1>
        </div>
        <div class="container">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Score</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    {%for item in items%}
                        <tr>
                            <td>{{item[1]}}</td>
                            <td>{{item[2]}}</td>
                            <td>{{item[3]}}</td>
                        </tr>
                    {%endfor%}
                </tbody>
            </table>
        </div>
        <script src="{{url_for('static', filename='main.js')}}"></script>
    </body>
</html>
